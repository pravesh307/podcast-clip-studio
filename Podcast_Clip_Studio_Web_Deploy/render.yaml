services:
  - type: web
    name: podcast-clip-studio
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEPLOY
        value: "1"
      - key: DATA_DIR
        value: /app/data
      - key: MAX_UPLOAD_GB
        value: "6"
      - key: APP_USERNAME
        value: pravesh
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_CLIP_MODEL
        value: gpt-4.1-mini
    disk:
      name: clip-storage
      mountPath: /app/data
      sizeGB: 30
